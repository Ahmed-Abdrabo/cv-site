// ---- tree sprite (drawn once, stippled)
const TW=620,TH=900; // sprite size
const spr=document.createElement('canvas');spr.width=TW;spr.height=TH;
const roots=document.createElement('canvas');roots.width=TW;roots.height=300;
function buildTree(){
  const g=spr.getContext('2d');g.clearRect(0,0,TW,TH);
  const mask=document.createElement('canvas');mask.width=TW;mask.height=TH;const m=mask.getContext('2d');
  m.fillStyle='#fff';
  // trunk
  m.fillRect(TW/2-12,300,24,TH-300);
  // foliage blobs: wobbling column
  const blobs=[];
  for(let i=0;i<9;i++){const t=i/8;const cy=120+t*430;const cx=TW/2+Math.sin(t*5.2)*70*(0.4+t*0.6);const r=88+Math.sin(t*3.1+1)*26+(1-t)*12;blobs.push([cx,cy,r,r*0.82])}
  blobs.push([TW/2,70,55,60]);
  for(const [x,y,rx,ry] of blobs){for(let k=0;k<6;k++){m.beginPath();m.ellipse(x+(R()-.5)*50,y+(R()-.5)*40,rx*(0.5+R()*0.5),ry*(0.5+R()*0.5),0,0,7);m.fill()}}
  // branches as lines
  m.strokeStyle='#fff';m.lineWidth=5;
  for(const [x,y,ex,ey] of BR){m.beginPath();m.moveTo(TW/2,y+40);m.lineTo(ex,ey);m.stroke()}
  const md=m.getImageData(0,0,TW,TH).data;
  g.fillStyle='#bfeadf';
  for(let n=0;n<420000;n++){
    const x=R()*TW|0,y=R()*TH|0;
    if(md[(y*TW+x)*4+3]>10){const s=R()<.2?2.2:1.6;g.globalAlpha=.6+R()*.4;g.fillRect(x,y,s,s)}
  }
  g.globalAlpha=1;
  // holes: darker dots to give texture
  g.globalCompositeOperation='destination-out';
  for(let n=0;n<5000;n++){g.fillRect(R()*TW,R()*TH*0.65,3,3)}
  g.globalCompositeOperation='source-over';
  // roots
  const r=roots.getContext('2d');r.strokeStyle='#bfeadf';r.lineCap='round';
  function root(x,y,a,len,w,d){if(d>5||len<8)return;const ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len;r.lineWidth=w;r.beginPath();r.moveTo(x,y);r.lineTo(ex,ey);r.stroke();
    const k=2+(R()<.4);for(let i=0;i<k;i++)root(ex,ey,a+(R()-.5)*1.3,len*(0.62+R()*.18),w*.68,d+1)}
  for(let i=0;i<5;i++)root(TW/2,0,Math.PI/2+(i-2)*.45+(R()-.5)*.2,70+R()*40,5,0);
}
// branch anchor points in sprite coords: [x,y,endx,endy,labelKey]

}
let cur={x:0,y:0,s:1},tgt={x:0,y:0,s:1},scene=null,t0=performance.now();
function home(){const s=mobile?Math.min(.5,(H*.8)/TH):Math.min(1,(H*.82)/TH+.05);return{s,x:W/2-TW*s/2,y:H*.93-TH*s}}
let BB={l:0,r:TW,t:0,b:TH};
function measure(){const d=spr.getContext('2d').getImageData(0,0,TW,TH).data;let l=TW,r=0,t=TH,b=0;
  for(let y=0;y<TH;y++)for(let x=0;x<TW;x++)if(d[(y*TW+x)*4+3]>40){if(x<l)l=x;if(x>r)r=x;if(y<t)t=y;if(y>b)b=y}
  BB={l,r,t,b}}
function sceneT(k){if(!mobile)return home();const side=LBL[k][0];const s=Math.min(.36,(H*.62)/TH);
  const x=side<0?W-8-BB.r*s:8-BB.l*s;return{s,x,y:H*.93-TH*s}}
function place(){tgt=scene?sceneT(scene):home();if(!cur.s)cur={...tgt}}
function frame(now){
  const dt=Math.min(.05,(now-t0)/1000);t0=now;const k=1-Math.pow(.0025,dt);
  cur.x+=(tgt.x-cur.x)*k;cur.y+=(tgt.y-cur.y)*k;cur.s+=(tgt.s-cur.s)*k;
  ctx.clearRect(0,0,W,H);
  const T=now/1000;
  for(const [x,y,r,p] of []){ctx.globalAlpha=.25+.45*(0.5+0.5*Math.sin(T*.8+p*30));ctx.fillStyle='#c3c6d8';ctx.fillRect(x,y,r,r)}
  ctx.globalAlpha=1;
  const gy=cur.y+TH*cur.s; // ground line
  // soil
  ctx.fillStyle='#0a1420';ctx.fillRect(0,gy,W,H-gy);
  // roots
  ctx.save();ctx.globalAlpha=Math.min(1,Math.max(0,(H-gy)/90))*.45;ctx.drawImage(roots,cur.x,gy-2,TW*cur.s,300*cur.s);ctx.restore();
  // tree
  ctx.save();ctx.drawImage(spr,cur.x,cur.y,TW*cur.s,TH*cur.s);ctx.restore();
  // grass
  ctx.strokeStyle='#bfeadf';ctx.lineWidth=1.1;ctx.globalAlpha=.8;ctx.beginPath();
  for(const [x,h,lean,ph] of grass){const sw=Math.sin(T*1.2+ph)*2.2;ctx.moveTo(x,gy+2);ctx.quadraticCurveTo(x+lean*h*.5,gy-h*.6,x+lean*h+sw,gy-h)}
  ctx.stroke();ctx.globalAlpha=1;
  // branch arrows (home only)
  const a=scene?0:1;
  moveLabels(a);
  requestAnimationFrame(frame);
}

  const ty=T.y+br[3]*T.s,bl=T.x+BB.l*T.s,bR=T.x+BB.r*T.s,gap=16,edge=14;
  P.classList.toggle('r',side<0);

  const lo=mobile?64:24;const top=Math.max(lo,Math.min(ty-14,H-130-(mobile?430:260)));P.style.top=top+'px';P.style.maxHeight=(H-130-top)+'px'}
let twT=0;
function typeIn(el){cancelAnimationFrame(twT);const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];let n;while(n=w.nextNode())ns.push([n,n.nodeValue]);
  ns.forEach(a=>a[0].nodeValue='');let i=0,j=0;
  const step=()=>{let c=6;while(c>0&&i<ns.length){const [nd,full]=ns[i];const take=Math.min(c,full.length-j);j+=take;c-=take;nd.nodeValue=full.slice(0,j);if(j>=full.length){i++;j=0}}
    if(i<ns.length)twT=requestAnimationFrame(step)};
  el.onclick=()=>{cancelAnimationFrame(twT);ns.forEach(a=>a[0].nodeValue=a[1])};step()}
function open(k){scene=k;$('#panel').innerHTML=PAGES[k];$('#panel').scrollTop=0;posPanel(k);typeIn($('#panel'));document.body.classList.add('scene');place();history.replaceState(null,'','#'+k)}
function closeScene(){scene=null;document.body.classList.remove('scene');place();history.replaceState(null,'',location.pathname)}

$('#back').onclick=closeScene;

// ---- music: generative, synthesised in the browser (no samples, no copyright)
const TRACKS=[
 {n:'neon deploy (synthwave)',kind:'synth',bpm:104,prog:[45,41,48,43],arp:[0,7,12,15,12,7],lead:[0,3,7,12,10,7,3,7]},
 {n:'midnight merge (electro)',kind:'synth',bpm:122,prog:[43,43,46,41],arp:[0,12,7,12,3,12,7,15],lead:[7,10,12,15,12,10,7,3]},
 {n:'drift in c (calm)',kind:'amb',root:48,sc:[0,2,4,7,9],bpm:54,wave:'sine'}];
let ac=null,master=null,noiseBuf=null,playing=false,ti=0,timer=null,step=0,nextT=0;
const mf=n=>440*Math.pow(2,(n-69)/12);
function tone(f,t,d,v,type,cut){const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type=type;o.frequency.value=f;
  fl.type='lowpass';fl.frequency.setValueAtTime(cut||4000,t);fl.frequency.exponentialRampToValueAtTime(Math.max(300,(cut||4000)/4),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(fl);fl.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
  g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3)}
function noise(t,d,v,hp){const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=ac.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
function schedule(){
  const tr=TRACKS[ti];
  if(tr.kind==='amb'){const spb=60/tr.bpm,t=ac.currentTime+.05;
    if(step%8===0){tone(mf(tr.root),t,spb*7,.12,tr.wave);tone(mf(tr.root+7),t,spb*7,.05,tr.wave)}
    if(Math.random()<.7){const n=tr.root+12+tr.sc[Math.random()*tr.sc.length|0]+(Math.random()<.3?12:0);tone(mf(n),t+Math.random()*.1,spb*3,.07,tr.wave)}
    step++;timer=setTimeout(schedule,spb*500);return}
  const sp=60/tr.bpm/4; // 16th
  while(nextT<ac.currentTime+.25){
    const t=nextT,i=step%16,bar=Math.floor(step/16)%4,root=tr.prog[bar];
    if(i%4===0)kick(t);
    if(i===4||i===12){noise(t,.16,.5,1800)}
    if(i%2===0)noise(t,.04,.18,7000);
    if(i%2===1)noise(t,.03,.08,9000);
    tone(mf(root-12+(i%4===2?12:0)),t,sp*1.6,.2,'sawtooth',900);
    tone(mf(root+12+tr.arp[i%tr.arp.length]),t,sp*1.4,.07,'square',2600);
    if(bar>=1&&i%2===0){tone(mf(root+24+tr.lead[(i/2)%tr.lead.length]),t,sp*3,.05,'sawtooth',3500)}
    if(i===0){tone(mf(root),t,sp*15,.05,'sawtooth',700);tone(mf(root+7),t,sp*15,.04,'sawtooth',700)}
    nextT+=sp;step++}
  timer=setTimeout(schedule,60)}
function setPlay(p){
  if(p){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.55;
      const dl=ac.createDelay();dl.delayTime.value=.3;const fb=ac.createGain();fb.gain.value=.3;master.connect(ac.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ac.destination);
      noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    ac.resume();step=0;nextT=ac.currentTime+.1;schedule()}else{clearTimeout(timer)}
  playing=p;$('#play').innerHTML=p?'&#10074;&#10074;':'&#9654;'}
$('#play').onclick=()=>setPlay(!playing);
$('#next').onclick=()=>{ti=(ti+1)%TRACKS.length;$('#title').textContent=TRACKS[ti].n;if(playing){clearTimeout(timer);step=0;nextT=ac.currentTime+.1;schedule()}};

// ---- background: a living service mesh (nodes = services, packets = requests/events)
const nv=document.getElementById('net'),nx=nv.getContext('2d');
let nodes=[],edges=[],packets=[],mouse={x:-999,y:-999},NW,NH;
function netInit(){
  NW=W;NH=H;nv.width=NW*DPR;nv.height=NH*DPR;nx.setTransform(DPR,0,0,DPR,0,0);
  const r=rng(99),cnt=Math.max(16,Math.min(34,Math.round(NW*NH/32000)));
  nodes=[];for(let i=0;i<cnt;i++)nodes.push({x:r()*NW,y:r()*NH*.86,vx:(r()-.5)*.12,vy:(r()-.5)*.12,ph:r()*6,down:0,hue:r()<.25?1:0});
  edges=[];for(let i=0;i<cnt;i++){const d=nodes.map((n,j)=>[j,Math.hypot(n.x-nodes[i].x,n.y-nodes[i].y)]).filter(a=>a[0]!==i).sort((a,b)=>a[1]-b[1]).slice(0,2);
    for(const [j] of d)if(!edges.some(e=>(e[0]===i&&e[1]===j)||(e[0]===j&&e[1]===i)))edges.push([i,j])}
  packets=[]}
function send(ei,rev){packets.push({e:ei,t:0,rev:!!rev,bounce:false,s:.004+Math.random()*.004})}
function pulse(x,y){let b=0,bd=1e9;nodes.forEach((n,i)=>{const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;b=i}});
  edges.forEach((e,i)=>{if(e[0]===b||e[1]===b)send(i,e[1]===b)});nodes[b].down=0}
addEventListener('pointermove',e=>{const f=$('#frame').getBoundingClientRect();mouse.x=e.clientX-f.left;mouse.y=e.clientY-f.top});
addEventListener('pointerdown',e=>{const f=$('#frame').getBoundingClientRect();pulse(e.clientX-f.left,e.clientY-f.top)});
let lastSpawn=0;
function netFrame(now){
  if(NW!==W||NH!==H)netInit();
  nx.clearRect(0,0,NW,NH);
  for(const n of nodes){n.x+=n.vx;n.y+=n.vy;if(n.x<10||n.x>NW-10)n.vx*=-1;if(n.y<10||n.y>NH*.86)n.vy*=-1;
    const dx=n.x-mouse.x,dy=n.y-mouse.y,d=Math.hypot(dx,dy);if(d<140&&d>1){n.x+=dx/d*.8;n.y+=dy/d*.8}
    if(n.down>0)n.down-=.004}
  nx.lineWidth=1;
  for(const [a,b] of edges){const A=nodes[a],B=nodes[b];const dead=A.down>0||B.down>0;nx.strokeStyle=dead?'rgba(255,140,120,.22)':'rgba(120,200,220,.2)';
    nx.setLineDash(dead?[4,6]:[]);nx.beginPath();nx.moveTo(A.x,A.y);nx.lineTo(B.x,B.y);nx.stroke()}
  nx.setLineDash([]);
  if(now-lastSpawn>420&&edges.length){lastSpawn=now;send(Math.random()*edges.length|0,Math.random()<.5)}
  for(let i=packets.length-1;i>=0;i--){const p=packets[i];const [a,b]=edges[p.e];let A=nodes[p.rev?b:a],B=nodes[p.rev?a:b];
    p.t+=p.s*(p.bounce?-1:1);
    // circuit breaker: rarely a target service fails, packet bounces back, then retried path heals
    if(!p.bounce&&p.t>.8&&!p.checked){p.checked=true;if(Math.random()<.07){B.down=1;p.bounce=true}}
    if(p.t<0||p.t>=1){if(!p.bounce&&Math.random()<.5){const nb=edges.map((e,j)=>[e,j]).filter(([e])=>e[0]===(p.rev?a:b)||e[1]===(p.rev?a:b));if(nb.length){const [e,j]=nb[Math.random()*nb.length|0];send(j,e[1]===(p.rev?a:b))}}packets.splice(i,1);continue}
    const x=A.x+(B.x-A.x)*p.t,y=A.y+(B.y-A.y)*p.t;
    nx.fillStyle=p.bounce?'rgba(255,150,130,.95)':'rgba(140,255,225,.95)';nx.shadowColor=nx.fillStyle;nx.shadowBlur=10;nx.beginPath();nx.arc(x,y,2.4,0,7);nx.fill();nx.shadowBlur=0}
  for(const n of nodes){const pr=.5+.5*Math.sin(now/700+n.ph);const dead=n.down>0;
    nx.strokeStyle=dead?'rgba(255,140,120,.9)':(n.hue?'rgba(170,150,255,.9)':'rgba(120,220,235,.85)');nx.fillStyle='#0c1726';nx.lineWidth=1.4;
    nx.beginPath();nx.arc(n.x,n.y,5+pr*1.2,0,7);nx.fill();nx.stroke();
    if(dead){nx.beginPath();nx.arc(n.x,n.y,10+(1-n.down)*8,0,7);nx.strokeStyle='rgba(255,140,120,'+(n.down*.5)+')';nx.stroke()}}
  requestAnimationFrame(netFrame)}
// ---- boot
function drawBranchArrows(){}
buildTree();measure();layout();cur={x:0,y:0,s:0};place();cur={...tgt};
const h=location.hash.slice(1);if(PAGES[h]){open(h);cur={...tgt}}
addEventListener('resize',()=>{if(scene)posPanel(scene)});requestAnimationFrame(frame);netInit();requestAnimationFrame(netFrame);
</script>
